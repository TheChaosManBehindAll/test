name: Debug Builds

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-builds:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      configuration: debug
      source_ref: ${{ github.ref }}
