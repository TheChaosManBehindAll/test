version = 1

[[annotations]]
path = [
    ".git*",
    ".github/**",
    "*.md",
    "**/*.md",
    "*.lock",
    "**/*.lock",
    "**/*.json",
    "**/*.png",
    "**/*.ico",
    "**/*.bmp",
    "**/*.jpeg",
    "**/*.jpg",
    "**/*.txt",
    "**/*.config",
    "packaging/macApp/**",
    "GhostStrap/Resources/**",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "GhostStrap/Resources/Fonts/Inter-*.ttf"
SPDX-FileCopyrightText = "2020 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "GhostStrap/Resources/Fonts/BuilderIcons-*.ttf",
    "GhostStrap/Resources/Icon2008.png",
    "GhostStrap/Resources/Icon2011.png",
    "GhostStrap/Resources/IconEarly2015.png",
    "GhostStrap/Resources/IconLate2015.png",
    "GhostStrap/Resources/Icon2017.png",
    "GhostStrap/Resources/Icon2019.png",
    "GhostStrap/Resources/Icon2022.png",
    "GhostStrap/Resources/Icon2025.png",
    "GhostStrap/Resources/RobloxVerified.png",
    "GhostStrap/Resources/BootstrapperStyles/ByfronDialog/**",
    "GhostStrap/Resources/BootstrapperStyles/TwentyFiveDialog/**",
    "GhostStrap/Resources/Mods/Cursor/From2006/**",
    "GhostStrap/Resources/Mods/Cursor/From2013/**",
    "GhostStrap/Resources/Mods/OldAvatarBackground.rbxl",
]
